name: OmniDrop CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-build-and-test:
    name: Backend CI (Java 24 & Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'maven'

      - name: Verify Maven & Java Version
        working-directory: backend
        run: |
          java -version
          mvn -version

      - name: Compile Backend Modules
        working-directory: backend
        run: mvn clean compile --batch-mode

      - name: Run Backend Unit & Network Tests
        working-directory: backend
        run: mvn test --batch-mode

      - name: Package Backend Jar
        working-directory: backend
        run: mvn package -DskipTests --batch-mode

  frontend-build-and-lint:
    name: Frontend CI (Node 22 / Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Type Check
        working-directory: frontend
        run: npm run lint

      - name: Build Next.js Application
        working-directory: frontend
        run: npm run build
