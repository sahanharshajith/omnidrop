# Spring Boot Server Configuration
server.port=8080
spring.application.name=omnidrop-backend

# OmniDrop Network Programming Configuration
omnidrop.node.name=OmniDrop-Node
omnidrop.node.id=
omnidrop.network.tcp-port=9090
omnidrop.network.udp-port=8888
omnidrop.network.broadcast-interval-ms=3000
omnidrop.network.peer-timeout-ms=12000
omnidrop.transfer.chunk-size-bytes=65536
omnidrop.transfer.socket-timeout-ms=15000
omnidrop.storage.downloads-dir=downloads
omnidrop.storage.checkpoints-dir=checkpoints

# Multipart Upload Limits (For Web UI local file staging)
spring.servlet.multipart.max-file-size=5GB
spring.servlet.multipart.max-request-size=5GB

# Logging Configuration
logging.level.com.omnidrop=DEBUG
logging.level.org.springframework.web=INFO
